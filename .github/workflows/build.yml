name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Install Android SDK platform 36
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-36"

      - name: Unzip project
        run: |
          unzip -q ./*.zip -d extracted
          echo "PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts | head -n 1)")" >> $GITHUB_ENV

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --console=plain > build.log 2>&1 || {
            grep -E "^e: |What went wrong|Caused by" -A5 build.log | head -40
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: HanifTranslator-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
